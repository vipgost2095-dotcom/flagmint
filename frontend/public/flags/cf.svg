<svg viewBox="-30 -24 660 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wave-CF" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" numOctaves="2" seed="137" result="turb">
        <animate attributeName="baseFrequency" dur="4.5s" repeatCount="indefinite"
          values="0.010 0.045;0.016 0.055;0.010 0.045"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="shine-CF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pole-CF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8f98"/>
      <stop offset="50%" stop-color="#e5e8ec"/>
      <stop offset="100%" stop-color="#8a8f98"/>
    </linearGradient>
    <clipPath id="clip-CF"><rect x="0" y="0" width="600" height="400"/></clipPath>
  </defs>

  <rect x="-14" y="-24" width="14" height="456" fill="url(#pole-CF)"/>
  <circle cx="-7" cy="-24" r="11" fill="#d9b64a"/>

  <g filter="url(#wave-CF)">
    <g clip-path="url(#clip-CF)">
      <rect x="0" y="0.0" width="600" height="80.6" fill="#003082"/><rect x="0" y="80.0" width="600" height="80.6" fill="#FFFFFF"/><rect x="0" y="160.0" width="600" height="80.6" fill="#289728"/><rect x="0" y="240.0" width="600" height="80.6" fill="#FFD700"/><rect x="0" y="320.0" width="600" height="80.6" fill="#D21034"/><rect x="276.0" y="0" width="48.0" height="400" fill="#D21034"/><polygon points="96.0,32.0 103.5,53.6 126.4,54.1 108.2,68.0 114.8,89.9 96.0,76.8 77.2,89.9 83.8,68.0 65.6,54.1 88.5,53.6" fill="#FFD700"/>
      <rect x="-600" y="0" width="1800" height="400" fill="url(#shine-CF)">
        <animateTransform attributeName="transform" type="translate" dur="5.5s" repeatCount="indefinite"
          values="-600 0; 600 0; -600 0"/>
      </rect>
    </g>
  </g>
