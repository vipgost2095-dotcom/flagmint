<svg viewBox="-30 -24 660 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wave-KP" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" numOctaves="2" seed="155" result="turb">
        <animate attributeName="baseFrequency" dur="4.5s" repeatCount="indefinite"
          values="0.010 0.045;0.016 0.055;0.010 0.045"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="shine-KP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pole-KP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8f98"/>
      <stop offset="50%" stop-color="#e5e8ec"/>
      <stop offset="100%" stop-color="#8a8f98"/>
    </linearGradient>
    <clipPath id="clip-KP"><rect x="0" y="0" width="600" height="400"/></clipPath>
  </defs>

  <rect x="-14" y="-24" width="14" height="456" fill="url(#pole-KP)"/>
  <circle cx="-7" cy="-24" r="11" fill="#d9b64a"/>

  <g filter="url(#wave-KP)">
    <g clip-path="url(#clip-KP)">
      <rect x="0" y="0.0" width="600" height="62.1" fill="#024FA2"/><rect x="0" y="61.5" width="600" height="16.0" fill="#fff"/><rect x="0" y="76.9" width="600" height="246.8" fill="#ED1C27"/><rect x="0" y="323.1" width="600" height="16.0" fill="#fff"/><rect x="0" y="338.5" width="600" height="62.1" fill="#024FA2"/><circle cx="168.0" cy="200.0" r="64.0" fill="#fff"/><polygon points="168.0,156.0 177.9,186.4 209.8,186.4 184.0,205.2 193.9,235.6 168.0,216.8 142.1,235.6 152.0,205.2 126.2,186.4 158.1,186.4" fill="#ED1C27"/>
      <rect x="-600" y="0" width="1800" height="400" fill="url(#shine-KP)">
        <animateTransform attributeName="transform" type="translate" dur="5.5s" repeatCount="indefinite"
          values="-600 0; 600 0; -600 0"/>
      </rect>
    </g>
  </g>
</svg>