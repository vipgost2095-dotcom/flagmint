<svg viewBox="-30 -24 660 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wave-TG" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" numOctaves="2" seed="155" result="turb">
        <animate attributeName="baseFrequency" dur="4.5s" repeatCount="indefinite"
          values="0.010 0.045;0.016 0.055;0.010 0.045"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="shine-TG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pole-TG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8f98"/>
      <stop offset="50%" stop-color="#e5e8ec"/>
      <stop offset="100%" stop-color="#8a8f98"/>
    </linearGradient>
    <clipPath id="clip-TG"><rect x="0" y="0" width="600" height="400"/></clipPath>
  </defs>

  <rect x="-14" y="-24" width="14" height="456" fill="url(#pole-TG)"/>
  <circle cx="-7" cy="-24" r="11" fill="#d9b64a"/>

  <g filter="url(#wave-TG)">
    <g clip-path="url(#clip-TG)">
      <rect x="0" y="0.0" width="600" height="67.3" fill="#006A4E"/><rect x="0" y="66.7" width="600" height="67.3" fill="#FCD116"/><rect x="0" y="133.3" width="600" height="67.3" fill="#006A4E"/><rect x="0" y="200.0" width="600" height="67.3" fill="#FCD116"/><rect x="0" y="266.7" width="600" height="67.3" fill="#006A4E"/><rect x="0" y="333.3" width="600" height="67.3" fill="#FCD116"/><rect width="216.0" height="184.6" fill="#D21034"/><polygon points="108.0,36.3 120.9,74.5 161.3,75.0 128.9,99.1 140.9,137.6 108.0,114.3 75.1,137.6 87.1,99.1 54.7,75.0 95.1,74.5" fill="#fff"/>
      <rect x="-600" y="0" width="1800" height="400" fill="url(#shine-TG)">
        <animateTransform attributeName="transform" type="translate" dur="5.5s" repeatCount="indefinite"
          values="-600 0; 600 0; -600 0"/>
      </rect>
    </g>
  </g>
</svg>