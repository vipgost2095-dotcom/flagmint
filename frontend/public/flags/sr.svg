<svg viewBox="-30 -24 660 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wave-SR" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" numOctaves="2" seed="165" result="turb">
        <animate attributeName="baseFrequency" dur="4.5s" repeatCount="indefinite"
          values="0.010 0.045;0.016 0.055;0.010 0.045"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="shine-SR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pole-SR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8f98"/>
      <stop offset="50%" stop-color="#e5e8ec"/>
      <stop offset="100%" stop-color="#8a8f98"/>
    </linearGradient>
    <clipPath id="clip-SR"><rect x="0" y="0" width="600" height="400"/></clipPath>
  </defs>

  <rect x="-14" y="-24" width="14" height="456" fill="url(#pole-SR)"/>
  <circle cx="-7" cy="-24" r="11" fill="#d9b64a"/>

  <g filter="url(#wave-SR)">
    <g clip-path="url(#clip-SR)">
      <rect x="0" y="0.0" width="600" height="87.6" fill="#377E3F"/><rect x="0" y="87.0" width="600" height="26.7" fill="#FFFFFF"/><rect x="0" y="113.0" width="600" height="174.5" fill="#B40A2D"/><rect x="0" y="287.0" width="600" height="26.7" fill="#FFFFFF"/><rect x="0" y="313.0" width="600" height="87.6" fill="#377E3F"/><polygon points="300.0,164.0 308.2,188.7 334.2,188.9 313.3,204.3 321.2,229.1 300.0,214.0 278.8,229.1 286.7,204.3 265.8,188.9 291.8,188.7" fill="#FFC400"/>
      <rect x="-600" y="0" width="1800" height="400" fill="url(#shine-SR)">
        <animateTransform attributeName="transform" type="translate" dur="5.5s" repeatCount="indefinite"
          values="-600 0; 600 0; -600 0"/>
      </rect>
    </g>
  </g>
</svg>