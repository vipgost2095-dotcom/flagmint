<svg viewBox="-30 -24 660 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wave-SS" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" numOctaves="2" seed="166" result="turb">
        <animate attributeName="baseFrequency" dur="4.5s" repeatCount="indefinite"
          values="0.010 0.045;0.016 0.055;0.010 0.045"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="shine-SS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pole-SS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8f98"/>
      <stop offset="50%" stop-color="#e5e8ec"/>
      <stop offset="100%" stop-color="#8a8f98"/>
    </linearGradient>
    <clipPath id="clip-SS"><rect x="0" y="0" width="600" height="400"/></clipPath>
  </defs>

  <rect x="-14" y="-24" width="14" height="456" fill="url(#pole-SS)"/>
  <circle cx="-7" cy="-24" r="11" fill="#d9b64a"/>

  <g filter="url(#wave-SS)">
    <g clip-path="url(#clip-SS)">
      <rect x="0" y="0.0" width="600" height="100.6" fill="#000000"/><rect x="0" y="100.0" width="600" height="100.6" fill="#E70011"/><rect x="0" y="200.0" width="600" height="100.6" fill="#000000"/><rect x="0" y="300.0" width="600" height="100.6" fill="#078930"/><polygon points="0,0 204.0,200.0 0,400" fill="#0F47AF"/><polygon points="85.7,176.0 91.3,192.2 108.5,192.6 94.8,203.0 99.8,219.4 85.7,209.6 71.6,219.4 76.5,203.0 62.9,192.6 80.0,192.2" fill="#FCDD09"/>
      <rect x="-600" y="0" width="1800" height="400" fill="url(#shine-SS)">
        <animateTransform attributeName="transform" type="translate" dur="5.5s" repeatCount="indefinite"
          values="-600 0; 600 0; -600 0"/>
      </rect>
    </g>
  </g>
</svg>