<svg viewBox="-30 -24 660 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wave-SY" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" numOctaves="2" seed="172" result="turb">
        <animate attributeName="baseFrequency" dur="4.5s" repeatCount="indefinite"
          values="0.010 0.045;0.016 0.055;0.010 0.045"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="shine-SY" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pole-SY" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8f98"/>
      <stop offset="50%" stop-color="#e5e8ec"/>
      <stop offset="100%" stop-color="#8a8f98"/>
    </linearGradient>
    <clipPath id="clip-SY"><rect x="0" y="0" width="600" height="400"/></clipPath>
  </defs>

  <rect x="-14" y="-24" width="14" height="456" fill="url(#pole-SY)"/>
  <circle cx="-7" cy="-24" r="11" fill="#d9b64a"/>

  <g filter="url(#wave-SY)">
    <g clip-path="url(#clip-SY)">
      <rect x="0" y="0.0" width="600" height="133.9" fill="#CE1126"/><rect x="0" y="133.3" width="600" height="133.9" fill="#FFFFFF"/><rect x="0" y="266.7" width="600" height="133.9" fill="#000000"/><polygon points="252.0,176.0 257.6,192.2 274.8,192.6 261.1,203.0 266.1,219.4 252.0,209.6 237.9,219.4 242.9,203.0 229.2,192.6 246.4,192.2" fill="#007A3D"/><polygon points="348.0,176.0 353.6,192.2 370.8,192.6 357.1,203.0 362.1,219.4 348.0,209.6 333.9,219.4 338.9,203.0 325.2,192.6 342.4,192.2" fill="#007A3D"/>
      <rect x="-600" y="0" width="1800" height="400" fill="url(#shine-SY)">
        <animateTransform attributeName="transform" type="translate" dur="5.5s" repeatCount="indefinite"
          values="-600 0; 600 0; -600 0"/>
