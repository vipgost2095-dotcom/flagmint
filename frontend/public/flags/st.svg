<svg viewBox="-30 -24 660 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wave-ST" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" numOctaves="2" seed="167" result="turb">
        <animate attributeName="baseFrequency" dur="4.5s" repeatCount="indefinite"
          values="0.010 0.045;0.016 0.055;0.010 0.045"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="shine-ST" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pole-ST" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8f98"/>
      <stop offset="50%" stop-color="#e5e8ec"/>
      <stop offset="100%" stop-color="#8a8f98"/>
    </linearGradient>
    <clipPath id="clip-ST"><rect x="0" y="0" width="600" height="400"/></clipPath>
  </defs>

  <rect x="-14" y="-24" width="14" height="456" fill="url(#pole-ST)"/>
  <circle cx="-7" cy="-24" r="11" fill="#d9b64a"/>

  <g filter="url(#wave-ST)">
    <g clip-path="url(#clip-ST)">
      <rect x="0" y="0.0" width="600" height="100.6" fill="#12AD2B"/><rect x="0" y="100.0" width="600" height="200.6" fill="#FCD116"/><rect x="0" y="300.0" width="600" height="100.6" fill="#12AD2B"/><polygon points="252.0,180.0 256.7,193.5 271.0,193.8 259.6,202.5 263.8,216.2 252.0,208.0 240.2,216.2 244.4,202.5 233.0,193.8 247.3,193.5" fill="#000"/><polygon points="348.0,180.0 352.7,193.5 367.0,193.8 355.6,202.5 359.8,216.2 348.0,208.0 336.2,216.2 340.4,202.5 329.0,193.8 343.3,193.5" fill="#000"/><polygon points="0,0 132.0,200.0 0,400" fill="#D21034"/>
      <rect x="-600" y="0" width="1800" height="400" fill="url(#shine-ST)">
        <animateTransform attributeName="transform" type="translate" dur="5.5s" repeatCount="indefinite"
          values="-600 0; 600 0; -600 0"/>
      </rect>
    </g>
  </g>
</svg>