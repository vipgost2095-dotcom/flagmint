<svg viewBox="-30 -24 660 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wave-MZ" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" numOctaves="2" seed="167" result="turb">
        <animate attributeName="baseFrequency" dur="4.5s" repeatCount="indefinite"
          values="0.010 0.045;0.016 0.055;0.010 0.045"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="shine-MZ" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pole-MZ" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8f98"/>
      <stop offset="50%" stop-color="#e5e8ec"/>
      <stop offset="100%" stop-color="#8a8f98"/>
    </linearGradient>
    <clipPath id="clip-MZ"><rect x="0" y="0" width="600" height="400"/></clipPath>
  </defs>

  <rect x="-14" y="-24" width="14" height="456" fill="url(#pole-MZ)"/>
  <circle cx="-7" cy="-24" r="11" fill="#d9b64a"/>

  <g filter="url(#wave-MZ)">
    <g clip-path="url(#clip-MZ)">
      <rect x="0" y="0.0" width="600" height="163.9" fill="#009A44"/><rect x="0" y="163.3" width="600" height="25.1" fill="#FFD200"/><rect x="0" y="187.8" width="600" height="25.1" fill="#1A1A1A"/><rect x="0" y="212.2" width="600" height="25.1" fill="#FFD200"/><rect x="0" y="236.7" width="600" height="163.9" fill="#D21034"/><polygon points="0,0 204.0,200.0 0,400" fill="#CE1126"/><polygon points="85.7,170.0 92.7,190.3 114.2,190.7 97.1,203.7 103.3,224.3 85.7,212.0 68.0,224.3 74.3,203.7 57.1,190.7 78.6,190.3" fill="#FCD116"/>
      <rect x="-600" y="0" width="1800" height="400" fill="url(#shine-MZ)">
        <animateTransform attributeName="transform" type="translate" dur="5.5s" repeatCount="indefinite"
          values="-600 0; 600 0; -600 0"/>
      </rect>
    </g>
  </g>
