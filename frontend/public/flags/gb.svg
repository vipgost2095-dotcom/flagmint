<svg viewBox="-30 -24 660 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wave-GB" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" numOctaves="2" seed="137" result="turb">
        <animate attributeName="baseFrequency" dur="4.5s" repeatCount="indefinite"
          values="0.010 0.045;0.016 0.055;0.010 0.045"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="shine-GB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pole-GB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8f98"/>
      <stop offset="50%" stop-color="#e5e8ec"/>
      <stop offset="100%" stop-color="#8a8f98"/>
    </linearGradient>
    <clipPath id="clip-GB"><rect x="0" y="0" width="600" height="400"/></clipPath>
  </defs>

  <rect x="-14" y="-24" width="14" height="456" fill="url(#pole-GB)"/>
  <circle cx="-7" cy="-24" r="11" fill="#d9b64a"/>

  <g filter="url(#wave-GB)">
    <g clip-path="url(#clip-GB)">
      <rect width="600" height="400" fill="#00247D"/><polygon points="-34.2,51.3 565.8,451.3 634.2,348.7 34.2,-51.3" fill="#fff"/><polygon points="34.2,451.3 634.2,51.3 565.8,-51.3 -34.2,348.7" fill="#fff"/><polygon points="-19.5,29.3 580.5,429.3 619.5,370.7 19.5,-29.3" fill="#CF142B"/><polygon points="19.5,429.3 619.5,29.3 580.5,-29.3 -19.5,370.7" fill="#CF142B"/><rect x="207.6" y="0" width="184.8" height="400" fill="#fff"/><rect x="0" y="138.4" width="600" height="123.2" fill="#fff"/><rect x="247.2" y="0" width="105.6" height="400" fill="#CF142B"/><rect x="0" y="164.8" width="600" height="70.4" fill="#CF142B"/>
      <rect x="-600" y="0" width="1800" height="400" fill="url(#shine-GB)">
        <animateTransform attributeName="transform" type="translate" dur="5.5s" repeatCount="indefinite"
          values="-600 0; 600 0; -600 0"/>
      </rect>
    </g>
  </g>
</svg>