<svg viewBox="-30 -24 660 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wave-SZ" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" numOctaves="2" seed="173" result="turb">
        <animate attributeName="baseFrequency" dur="4.5s" repeatCount="indefinite"
          values="0.010 0.045;0.016 0.055;0.010 0.045"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="shine-SZ" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pole-SZ" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8f98"/>
      <stop offset="50%" stop-color="#e5e8ec"/>
      <stop offset="100%" stop-color="#8a8f98"/>
    </linearGradient>
    <clipPath id="clip-SZ"><rect x="0" y="0" width="600" height="400"/></clipPath>
  </defs>

  <rect x="-14" y="-24" width="14" height="456" fill="url(#pole-SZ)"/>
  <circle cx="-7" cy="-24" r="11" fill="#d9b64a"/>

  <g filter="url(#wave-SZ)">
    <g clip-path="url(#clip-SZ)">
      <rect x="0" y="0.0" width="600" height="103.2" fill="#3A5CA9"/><rect x="0" y="102.6" width="600" height="21.1" fill="#FFD900"/><rect x="0" y="123.1" width="600" height="154.4" fill="#B10C0C"/><rect x="0" y="276.9" width="600" height="21.1" fill="#FFD900"/><rect x="0" y="297.4" width="600" height="103.2" fill="#3A5CA9"/><line x1="260.0" y1="48.0" x2="260.0" y2="352.0" stroke="#8B4513" stroke-width="5"/><line x1="340.0" y1="48.0" x2="340.0" y2="352.0" stroke="#8B4513" stroke-width="5"/><ellipse cx="300.0" cy="200.0" rx="44.0" ry="80.0" fill="#8B4513" stroke="#000" stroke-width="3"/>
      <rect x="-600" y="0" width="1800" height="400" fill="url(#shine-SZ)">
        <animateTransform attributeName="transform" type="translate" dur="5.5s" repeatCount="indefinite"
          values="-600 0; 600 0; -600 0"/>
      </rect>
    </g>
  </g>
</svg>