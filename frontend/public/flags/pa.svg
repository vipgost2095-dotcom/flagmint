<svg viewBox="-30 -24 660 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wave-PA" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" numOctaves="2" seed="145" result="turb">
        <animate attributeName="baseFrequency" dur="4.5s" repeatCount="indefinite"
          values="0.010 0.045;0.016 0.055;0.010 0.045"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="shine-PA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pole-PA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8f98"/>
      <stop offset="50%" stop-color="#e5e8ec"/>
      <stop offset="100%" stop-color="#8a8f98"/>
    </linearGradient>
    <clipPath id="clip-PA"><rect x="0" y="0" width="600" height="400"/></clipPath>
  </defs>

  <rect x="-14" y="-24" width="14" height="456" fill="url(#pole-PA)"/>
  <circle cx="-7" cy="-24" r="11" fill="#d9b64a"/>

  <g filter="url(#wave-PA)">
    <g clip-path="url(#clip-PA)">
      <rect x="0" y="0" width="300.0" height="200.0" fill="#FFFFFF"/><rect x="300.0" y="0" width="300.0" height="200.0" fill="#D21034"/><rect x="0" y="200.0" width="300.0" height="200.0" fill="#0072C6"/><rect x="300.0" y="200.0" width="300.0" height="200.0" fill="#FFFFFF"/><polygon points="450.0,64.0 458.2,88.7 484.2,88.9 463.3,104.3 471.2,129.1 450.0,114.0 428.8,129.1 436.7,104.3 415.8,88.9 441.8,88.7" fill="#0072C6"/><polygon points="150.0,264.0 158.2,288.7 184.2,288.9 163.3,304.3 171.2,329.1 150.0,314.0 128.8,329.1 136.7,304.3 115.8,288.9 141.8,288.7" fill="#D21034"/>
      <rect x="-600" y="0" width="1800" height="400" fill="url(#shine-PA)">
        <animateTransform attributeName="transform" type="translate" dur="5.5s" repeatCount="indefinite"
          values="-600 0; 600 0; -600 0"/>
      </rect>
    </g>
  </g>
</svg>